<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="贪吃蛇">
<meta name="theme-color" content="#203731">
<title>贪吃蛇 🐍</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:#203731; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; color:#eee; }
  body{ display:flex; flex-direction:column; align-items:center; padding:18px 12px 30px; min-height:100vh; }
  h1{ margin:0 0 10px; font-size:24px; }
  .score-line{ margin-bottom:14px; font-size:16px; }
  #score{ font-weight:900; color:#7fd86b; }
  .wrap{ position:relative; width:min(92vw,420px); background:#16251f; border-radius:10px; overflow:hidden; }
  canvas{ display:block; width:100%; height:auto; touch-action:none; }
  .msg{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.6); font-size:22px; font-weight:800; color:#fff; text-align:center; z-index:5; }
  .msg.show{ display:flex; }
  .btn-row{ display:flex; gap:10px; margin-top:14px; }
  button{ border:none; border-radius:10px; padding:10px 22px; font-size:15px; font-weight:800; background:#7fd86b; color:#203731; cursor:pointer; }
  .hint{ margin-top:12px; font-size:12px; color:#8fa; text-align:center; }
</style>
</head>
<body>
<h1>🐍 贪吃蛇</h1>
<div class="score-line">分数 <span id="score">0</span></div>
<div class="wrap">
  <canvas id="cv"></canvas>
  <div class="msg" id="msg">💤 玩玩吧</div>
</div>
<div class="btn-row">
  <button id="btnStart">▶ 开始</button>
  <button id="btnPause" disabled>⏸ 暂停</button>
</div>
<div class="hint">方向键 / 滑动控制蛇 🐍，吃到红苹果 🍎 变长加分</div>
<script>
(function(){
'use strict';
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var scale=20, cols, rows;
var snake, dir, nextDir, food, score, timer, speed, over, paused, started;
var scoreEl=document.getElementById('score'), msgEl=document.getElementById('msg');
function resize(){
  var w=Math.min(document.querySelector('.wrap').clientWidth, 420);
  cv.width=w; cv.height=w;
  cols=Math.floor(w/scale); rows=Math.floor(w/scale);
}
function reset(){
  snake=[{x:Math.floor(cols/2), y:Math.floor(rows/2)}];
  dir={x:1,y:0}; nextDir={x:1,y:0};
  score=0; speed=130; over=false; paused=false; started=false;
  scoreEl.textContent=0;
  msgEl.classList.add('show'); msgEl.textContent='🐍 点「开始」玩游戏';
  spawnFood();
  draw();
}
function spawnFood(){
  while(true){
    var f={x:Math.floor(Math.random()*cols), y:Math.floor(Math.random()*rows)};
    var hit=snake.some(function(s){return s.x===f.x&&s.y===f.y;});
    if(!hit){ food=f; return; }
  }
}
function step(){
  if(over||paused||!started) return;
  dir=nextDir;
  var head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if(head.x<0||head.y<0||head.x>=cols||head.y>=rows){ gameOver('💥 撞墙啦'); return; }
  var hitSelf=snake.some(function(s){return s.x===head.x&&s.y===head.y;});
  if(hitSelf){ gameOver('😵 咬到自己啦'); return; }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=10; scoreEl.textContent=score;
    spawnFood();
    if(speed>70) speed-=4;
  } else {
    snake.pop();
  }
  draw();
}
function gameOver(txt){
  over=true; started=false;
  msgEl.textContent=txt+'\n得分 '+score; msgEl.classList.add('show');
  document.getElementById('btnPause').disabled=true;
  clearInterval(timer);
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#16251f'; ctx.fillRect(0,0,cv.width,cv.height);
  // grid
  ctx.strokeStyle='rgba(255,255,255,.04)'; ctx.lineWidth=1;
  for(var i=0;i<=cols;i++){ ctx.beginPath(); ctx.moveTo(i*scale,0); ctx.lineTo(i*scale,cv.height); ctx.stroke(); }
  for(var j=0;j<=rows;j++){ ctx.beginPath(); ctx.moveTo(0,j*scale); ctx.lineTo(cv.width,j*scale); ctx.stroke(); }
  // food
  ctx.fillStyle='#ff5252';
  ctx.beginPath(); ctx.arc(food.x*scale+scale/2, food.y*scale+scale/2, scale*0.4, 0, Math.PI*2); ctx.fill();
  // snake
  snake.forEach(function(s, idx){
    ctx.fillStyle = idx===0 ? '#7fd86b' : '#4caf50';
    ctx.fillRect(s.x*scale+1, s.y*scale+1, scale-2, scale-2);
    ctx.fillStyle='rgba(0,0,0,.2)';
    ctx.fillRect(s.x*scale+1, s.y*scale+1, scale-2, 3);
  });
}
function start(){
  if(over){ reset(); }
  started=true; paused=false;
  msgEl.classList.remove('show');
  document.getElementById('btnPause').disabled=false;
  clearInterval(timer);
  timer=setInterval(step, speed);
}
document.getElementById('btnStart').onclick=start;
document.getElementById('btnPause').onclick=function(){
  if(!started||over) return;
  paused=!paused;
  this.textContent=paused?'▶ 继续':'⏸ 暂停';
  msgEl.classList.toggle('show', paused);
  if(paused) msgEl.textContent='⏸ 已暂停';
};
window.addEventListener('keydown', function(e){
  var k=e.key;
  var nd=null;
  if(k==='ArrowUp') nd={x:0,y:-1};
  else if(k==='ArrowDown') nd={x:0,y:1};
  else if(k==='ArrowLeft') nd={x:-1,y:0};
  else if(k==='ArrowRight') nd={x:1,y:0};
  if(nd){
    e.preventDefault();
    if(!started){ start(); }
    if(nd.x!==-dir.x||nd.y!==-dir.y) nextDir=nd;
  }
});
var tsx=0,tsy=0;
cv.addEventListener('touchstart',function(e){ if(e.touches.length){tsx=e.touches[0].clientX;tsy=e.touches[0].clientY;} },{passive:true});
cv.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-tsx, dy=e.changedTouches[0].clientY-tsy;
  if(Math.abs(dx)<22&&Math.abs(dy)<22){ if(!started) start(); return; }
  if(!started) start();
  var nd = Math.abs(dx)>Math.abs(dy) ? {x:dx>0?1:-1,y:0} : {x:0,y:dy>0?1:-1};
  if(nd.x!==-dir.x||nd.y!==-dir.y) nextDir=nd;
},{passive:true});
resize(); reset();
window.addEventListener('resize', resize);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="2048">
<meta name="theme-color" content="#FAF8EF">
<title>2048 🎯</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:#FAF8EF; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
  body{ display:flex; flex-direction:column; align-items:center; padding:18px 12px 30px; min-height:100vh; }
  h1{ margin:0 0 4px; font-size:24px; color:#776E65; }
  .score-box{ display:flex; gap:10px; margin-bottom:16px; }
  .score{ background:#BBADA0; color:#fff; border-radius:8px; padding:6px 14px; text-align:center; min-width:80px; }
  .score .lb{ font-size:11px; opacity:.8; }
  .score .vl{ font-size:20px; font-weight:800; }
  .board-wrap{ position:relative; width:min(92vw, 420px); aspect-ratio:1/1; }
  .board{ position:absolute; inset:0; background:#BBADA0; border-radius:10px; padding:10px; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .cell{ background:rgba(238,228,218,.35); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:800; color:#776E65; transition:background .1s; }
  .tile{ position:absolute; width:calc((100% - 50px)/4); height:calc((100% - 50px)/4); border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:800; transition:left .12s ease, top .12s ease, transform .12s ease; }
  .msg{ margin-top:16px; font-size:15px; font-weight:700; color:#f65e3b; min-height:22px; text-align:center; }
  .btn-row{ display:flex; gap:10px; margin-top:10px; }
  button{ border:none; border-radius:10px; padding:10px 20px; font-size:15px; font-weight:800; background:#8F7A66; color:#fff; cursor:pointer; }
  button.new{ background:#F2B179; }
  .hint{ margin-top:14px; font-size:12px; color:#9b948a; text-align:center; }
  @media (max-width:420px){ .cell,.tile{ font-size:26px; } }
</style>
</head>
<body>
<h1>2048</h1>
<div class="score-box">
  <div class="score"><div class="lb">分数</div><div class="vl" id="score">0</div></div>
  <div class="score"><div class="lb">最高</div><div class="vl" id="best">0</div></div>
</div>
<div class="board-wrap">
  <div class="board" id="board"></div>
</div>
<div class="msg" id="msg"></div>
<div class="btn-row">
  <button class="new" id="btnNew">🔄 新游戏</button>
</div>
<div class="hint">滑动屏幕或方向键移动方块，相同数字合并，合成 2048！</div>
<script>
(function(){
'use strict';
var SIZE=4, grid, score, best=+(localStorage.getItem('g2048.best')||0);
var board=document.getElementById('board');
var msg=document.getElementById('msg');
var scoreEl=document.getElementById('score'), bestEl=document.getElementById('best');
var moving=false;

function emptyGrid(){ var g=[]; for(var i=0;i<SIZE;i++) g.push(new Array(SIZE).fill(0)); return g; }
function newTile(){
  var empties=[];
  for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++) if(!grid[r][c]) empties.push(r+','+c);
  if(!empties.length) return;
  var cell=empties[Math.floor(Math.random()*empties.length)].split(',');
  grid[+cell[0]][+cell[1]] = Math.random()<0.9?2:4;
}
function slideLine(line){
  var arr=line.filter(function(v){return v;});
  var out=[];
  for(var i=0;i<arr.length;i++){
    if(arr[i]===arr[i+1]){ out.push(arr[i]*2); score+=arr[i]*2; i++; }
    else out.push(arr[i]);
  }
  while(out.length<SIZE) out.push(0);
  return out;
}
function move(dir){
  // dir: 0左 1右 2上 3下
  var old = JSON.stringify(grid);
  var newGrid = emptyGrid();
  for(var i=0;i<SIZE;i++){
    var line=[];
    for(var j=0;j<SIZE;j++){
      var v = dir===0?grid[i][j] : dir===1?grid[i][SIZE-1-j] : dir===2?grid[j][i] : grid[SIZE-1-j][i];
      line.push(v);
    }
    var slid = slideLine(line);
    for(var k=0;k<SIZE;k++){
      var val=slid[k];
      if(dir===0) newGrid[i][k]=val;
      else if(dir===1) newGrid[i][SIZE-1-k]=val;
      else if(dir===2) newGrid[k][i]=val;
      else newGrid[SIZE-1-k][i]=val;
    }
  }
  grid=newGrid;
  if(JSON.stringify(grid)!==old){
    newTile();
    render();
    check();
  }
}
function check(){
  if(score>best){ best=score; localStorage.setItem('g2048.best', best); bestEl.textContent=best; }
  var has2048=false, hasEmpty=false;
  for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++){
    if(grid[r][c]>=2048) has2048=true;
    if(!grid[r][c]) hasEmpty=true;
  }
  if(has2048){ msg.textContent='🎉 恭喜合成 2048！'; }
  else if(!hasEmpty && !canMove()){ msg.textContent='💀 没有可移动的啦，点新游戏重来'; }
}
function canMove(){
  for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++){
    if(r+1<SIZE && grid[r][c]===grid[r+1][c]) return true;
    if(c+1<SIZE && grid[r][c]===grid[r][c+1]) return true;
  }
  return false;
}
var TILE_STYLE={ 2:'#EEE4DA',4:'#EDE0C8',8:'#F2B179',16:'#F59563',32:'#F67C5F',64:'#F65E3B',128:'#EDCF72',256:'#EDCC61',512:'#EDC850',1024:'#EDC53F',2048:'#EDC22E' };
function render(){
  scoreEl.textContent=score; bestEl.textContent=best;
  // 清掉旧 tile（只保留底格）
  board.innerHTML='';
  for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++){
    var bg=document.createElement('div'); bg.className='cell'; board.appendChild(bg);
  }
  for(var r2=0;r2<SIZE;r2++)for(var c2=0;c2<SIZE;c2++){
    var v=grid[r2][c2]; if(!v) continue;
    var t=document.createElement('div');
    t.className='tile';
    t.style.left='calc('+(c2*25)+'% + '+(c2*10+10)+'px)';
    t.style.top='calc('+(r2*25)+'% + '+(r2*10+10)+'px)';
    t.style.background=TILE_STYLE[v]||'#3E3933';
    t.style.color=(v===2||v===4)?'#776E65':'#fff';
    t.style.fontSize = v>=1024?'18px':(v>=128?'24px':'34px');
    t.textContent=v;
    board.appendChild(t);
  }
}
function init(){
  score=0; grid=emptyGrid(); msg.textContent='';
  newTile(); newTile(); render();
}
document.getElementById('btnNew').onclick=init;
// 方向键
document.addEventListener('keydown', function(e){
  if(e.key==='ArrowUp'){e.preventDefault();move(2);}
  else if(e.key==='ArrowDown'){e.preventDefault();move(3);}
  else if(e.key==='ArrowLeft'){e.preventDefault();move(0);}
  else if(e.key==='ArrowRight'){e.preventDefault();move(1);}
});
// 触屏滑动
var sx=0,sy=0;
var wrap=document.querySelector('.board-wrap');
wrap.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
wrap.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)<24 && Math.abs(dy)<24) return;
  if(Math.abs(dx)>Math.abs(dy)) move(dx>0?1:0); else move(dy>0?3:2);
},{passive:true});
init();
})();
</script>
</body>
</html>
